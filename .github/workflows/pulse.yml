name: system-pulse-sync

on:
  schedule:
    # 13:30 UTC = 8:30 AM CST (Pre-market Briefing Mon-Fri)
    - cron: "30 13 * * 1-5"
    # 21:30 UTC = 4:30 PM CST (Market Close & Daily Infra Health every day)
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: system-pulse
  cancel-in-progress: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Infrastructure Heartbeat
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          python src/infra/heartbeat.py

      - name: Run Daily Market Pulse
        run: |
          python src/market/pulse.py

      - name: Regenerate Dashboard README
        run: |
          python src/update_readme.py

      - name: Commit and Push Telemetry Updates
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          # Configure SSH commit signing if secret is set
          if [ -n "$SIGNING_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SIGNING_KEY" > ~/.ssh/signing_key
            chmod 600 ~/.ssh/signing_key
            git config user.signingkey ~/.ssh/signing_key
            git config gpg.format ssh
            git config commit.gpgsign true
          fi

          git config user.name "Benjamin Bamisile"
          git config user.email "bambobtim@gmail.com"

          git add data/ README.md
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
            exit 0
          fi

          git commit -m "telemetry: daily system pulse update $(date -u +%F)"

          # Push with retry
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Successfully pushed telemetry update."
              exit 0
            fi
            echo "Push conflict encountered, retrying (attempt $attempt/3)..."
            git fetch origin main
            git rebase -X theirs origin/main 2>/dev/null || git rebase --abort
            sleep 2
          done
